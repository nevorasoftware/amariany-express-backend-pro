# Configuración Servidor y Puerto Railway
server.port=${PORT:8080}
server.servlet.context-path=/

# Configuración Base de Datos PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/amairany_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Archivos / Multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Variables de Administración por Defecto
admin.email=${ADMIN_EMAIL:admin@amairanyexpress.sv}
admin.password=${ADMIN_PASSWORD:admin123}
